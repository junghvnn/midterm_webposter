<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>화면 속 작은 전시장</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="poster">
      <img class="background" src="background.png" alt="전시 배경" />

      <!-- A카드+사람 -->
      <div class="card card-a">
        <div class="moving">
          <img class="card-image" src="A_card.png" alt="포스터 카드 A" />
        </div>
        <div class="people">
          <img class="person person-a-0" src="people-2.png" alt="" />
          <img class="person person-a-1" src="people-5.png" alt="" />
        </div>
      </div>

      <!-- 카드 B+사람 -->
      <div class="card card-b">
        <div class="moving">
          <img class="card-image" src="B_card.png" alt="포스터 카드 B" />
        </div>
        <div class="people">
          <img class="person person-b-extra" src="people-8.png" alt="" />
          <img class="person person-c-0" src="people-1.png" alt="" />
          <img class="person person-c-1" src="people-2.png" alt="" />
          <img class="person person-c-2" src="people-3.png" alt="" />
          <img class="person person-c-3" src="people-4.png" alt="" />
        </div>
      </div>

      <!-- 카드 C+사람 -->
      <div class="card card-c">
        <div class="moving">
          <img class="card-image" src="C_card.png" alt="포스터 카드 C" />
        </div>
        <div class="people">
          <img class="person person-b-0" src="people-7.png" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
